<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a Park — Ontario Playground</title>
<meta name="description" content="Search and filter accessible playgrounds, splash pads, and beaches across Ontario by age group, facilities, surfacing, and equipment condition.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Be+Vietnam+Pro:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
<nav class="hp-nav" aria-label="Main">
  <div class="hp-nav-inner">
    <a class="hp-brand" href="/">Ontario Playground</a>
    <div class="hp-nav-links" id="site-nav">
      <a class="is-current" href="/explore.html">Find a Park</a>
      <!-- Phone-only: the header's action pill is hidden under 640px, so without
           these there is no route to the form or the about page on a phone. -->
      <a class="hp-nav-only-mobile" href="/submit.html">Add a Park</a>
      <a class="hp-nav-only-mobile" href="/about.html">About us</a>
    </div>
    <div class="hp-nav-actions">
      <a class="hp-nav-cta" href="/submit.html"><span class="ms" aria-hidden="true">add_location</span> Add a Park</a>
      <button class="hp-nav-toggle" id="nav-toggle" type="button" aria-expanded="false"
              aria-controls="site-nav" aria-label="Menu">
        <span class="ms" aria-hidden="true">menu</span>
      </button>
    </div>
  </div>
</nav>

<main id="explore" class="explore-wrap" aria-label="Explore locations">
  <aside class="rail">
   <div class="rail-top">
    <div class="search-box">
      <span class="ms" aria-hidden="true">search</span>
      <input id="f-q" type="search" placeholder="Search parks, trails, or splash pads…" aria-label="Search by name">
    </div>

    <details class="card filter-card" id="filter-card" open>
      <summary><span class="ms" aria-hidden="true">tune</span> Filters <span class="ms chev" aria-hidden="true">chevron_right</span></summary>
      <div class="filter-group">
        <div class="chip-row" id="type-chips" role="group" aria-label="Location types"></div>
      </div>
      <div class="filter-group">
        <div class="chip-row" id="age-chips" role="group" aria-label="Age groups"></div>
      </div>
      <div class="filter-group">
        <div class="fac-row" id="fac-chips" role="group" aria-label="Facilities">
          <!-- Icon-only. The .fac-label span is the button's accessible name AND
               its hover/focus tooltip; below 900px (and on any hover-less
               pointer) it becomes a visible inline label instead. -->
          <button class="fac-btn" data-f="accessible" aria-pressed="false"><span class="ms" aria-hidden="true">accessible</span><span class="fac-label">Accessible</span></button>
          <button class="fac-btn" data-f="washroom" aria-pressed="false"><span class="ms" aria-hidden="true">wc</span><span class="fac-label">Washroom</span></button>
          <button class="fac-btn" data-f="parking" aria-pressed="false"><span class="ms" aria-hidden="true">local_parking</span><span class="fac-label">Parking</span></button>
          <button class="fac-btn" data-f="shade" aria-pressed="false"><span class="ms" aria-hidden="true">nature</span><span class="fac-label">Shade</span></button>
          <button class="fac-btn" data-f="fenced" aria-pressed="false"><span class="ms" aria-hidden="true">fence</span><span class="fac-label">Fenced</span></button>
        </div>
      </div>

      <div class="filter-foot">
        <details class="more-filters" id="more-filters">
          <summary><span class="ms chev" aria-hidden="true">chevron_right</span> More filters</summary>
          <div class="more-grid">
            <div class="field">
              <label for="f-cond">Equipment condition</label>
              <select id="f-cond"><option value="">Any condition</option></select>
            </div>
            <div class="field">
              <label for="f-surface">Surface type</label>
              <select id="f-surface"><option value="">Any surface</option></select>
            </div>
            <label class="more-check">
              <input type="checkbox" id="f-water"> Has a water fountain
            </label>
          </div>
        </details>
        <button class="linkbtn" id="clear-filters">Clear all</button>
      </div>
    </details>
   </div>

   <div class="rail-bottom">
    <div class="card">
      <h3 class="results-head">Fun nearby <span class="mini-chip" id="count-pill">0</span></h3>
      <div class="results" id="park-list" role="listbox" aria-label="Matching locations"></div>
    </div>

    <details class="insights card">
      <summary><span class="ms" aria-hidden="true">chevron_right</span> Community Insights</summary>
      <div class="kpis" id="kpis" aria-live="polite"></div>
      <div class="chart-block"><h4>Playground equipment by age group</h4>
        <canvas id="chart-type" height="190" role="img" aria-label="Bar chart of playground equipment types by age group"></canvas></div>
      <div class="chart-block"><h4>Equipment condition</h4>
        <canvas id="chart-cond" height="170" role="img" aria-label="Doughnut chart of equipment condition"></canvas></div>
      <div class="chart-block"><h4>Surfacing</h4>
        <canvas id="chart-surf" height="170" role="img" aria-label="Doughnut chart of surfacing materials"></canvas></div>
    </details>
   </div>
  </aside>

  <div class="map-panel">
    <div id="map" aria-label="Map of locations"></div>
    <div class="legend" role="group" aria-label="Map legend">
      <div><span class="lg-dot t-playground"></span> Playground</div>
      <div><span class="lg-dot t-splash_pad"></span> Splash pad</div>
      <div><span class="lg-dot t-beach"></span> Beach</div>
    </div>

    <div class="map-controls">
      <button class="map-btn" id="btn-locate" type="button" aria-label="Centre the map on my location">
        <span class="ms" aria-hidden="true">my_location</span>
      </button>
      <div class="map-zoom">
        <button class="map-btn" id="btn-zoom-in" type="button" aria-label="Zoom in">
          <span class="ms" aria-hidden="true">add</span>
        </button>
        <button class="map-btn" id="btn-zoom-out" type="button" aria-label="Zoom out">
          <span class="ms" aria-hidden="true">remove</span>
        </button>
      </div>
    </div>
  </div>
</main>

<!-- Phone-only shortcut to the form. This page has no footer, so without it the
     only route is the collapsed header menu. -->
<a class="fab" href="/submit.html" aria-label="Add a park">
  <span class="ms" aria-hidden="true">add</span>
</a>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/explore.js"></script>
</body>
</html>
